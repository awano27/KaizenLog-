<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">KaizenLog の初回導線 — setup → doctor → generate</title>
  <desc id="desc">setup で接続先を選び、doctor で診断し、日付を明示した generate で最初の日誌を作る。</desc>
  <defs>
    <polygon id="arw" points="-16,-4 0,-4 0,-11 16,0 0,11 0,4 -16,4"/>
  </defs>
  <rect width="1440" height="430" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif">

    <rect x="48" y="30" width="300" height="38" rx="8" fill="#0451B5"/>
    <text x="70" y="56" fill="#FFFFFF" font-size="19" font-weight="800">はじめの3コマンド（初回導線）</text>

    <use href="#arw" x="486" y="220" fill="#0451B5"/>
    <use href="#arw" x="953" y="220" fill="#0E8A91"/>

    <g transform="translate(48 100)">
      <rect width="410" height="240" rx="16" fill="#F4F9FE" stroke="#CFE2F7" stroke-width="2"/>
      <circle cx="46" cy="46" r="22" fill="#0451B5"/>
      <text x="46" y="54" fill="#FFFFFF" font-size="23" font-weight="800" text-anchor="middle">1</text>
      <text x="84" y="56" fill="#03113C" font-size="28" font-weight="800">接続先を選ぶ</text>
      <path d="M32 100H378" stroke="#CFE2F7" stroke-width="2" stroke-dasharray="3 5"/>
      <text x="32" y="146" fill="#0451B5" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="24" font-weight="700">kaizenlog setup</text>
      <text x="32" y="190" fill="#313E5C" font-size="18" font-weight="600">ボールト・タイムゾーンを</text>
      <text x="32" y="216" fill="#313E5C" font-size="18" font-weight="600">対話で決める</text>
    </g>

    <g transform="translate(515 100)">
      <rect width="410" height="240" rx="16" fill="#F4F9FE" stroke="#CFE2F7" stroke-width="2"/>
      <circle cx="46" cy="46" r="22" fill="#0451B5"/>
      <text x="46" y="54" fill="#FFFFFF" font-size="23" font-weight="800" text-anchor="middle">2</text>
      <text x="84" y="56" fill="#03113C" font-size="28" font-weight="800">設定を診断する</text>
      <path d="M32 100H378" stroke="#CFE2F7" stroke-width="2" stroke-dasharray="3 5"/>
      <text x="32" y="146" fill="#0451B5" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="24" font-weight="700">kaizenlog doctor</text>
      <text x="32" y="190" fill="#313E5C" font-size="18" font-weight="600">ActivityWatch 接続と</text>
      <text x="32" y="216" fill="#313E5C" font-size="18" font-weight="600">書き込み先を確認</text>
    </g>

    <g transform="translate(982 100)">
      <rect width="410" height="240" rx="16" fill="#F6FBFC" stroke="#C7E4E6" stroke-width="2"/>
      <circle cx="46" cy="46" r="22" fill="#0E8A91"/>
      <text x="46" y="54" fill="#FFFFFF" font-size="23" font-weight="800" text-anchor="middle">3</text>
      <text x="84" y="56" fill="#0E8A91" font-size="28" font-weight="800">最初の日誌</text>
      <path d="M32 100H378" stroke="#C7E4E6" stroke-width="2" stroke-dasharray="3 5"/>
      <text x="32" y="141" fill="#0E8A91" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="24" font-weight="700">kaizenlog generate</text>
      <text x="32" y="171" fill="#0E8A91" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="24" font-weight="700">  --date YYYY-MM-DD</text>
      <text x="32" y="212" fill="#313E5C" font-size="18" font-weight="600">日付を明示すれば追いつき無し</text>
    </g>

    <rect x="48" y="364" width="1344" height="46" rx="12" fill="#F4F9FE" stroke="#CFE2F7" stroke-width="2"/>
    <text x="76" y="394" fill="#03113C" font-size="20" font-weight="700">ここまで LLM の設定は不要。日誌だけなら <tspan font-family="ui-monospace, Consolas, monospace" fill="#0451B5" font-weight="800">generate</tspan> で完結します。</text>
  </g>
</svg>
