<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">KaizenLogのAI改善ループ</title>
  <desc id="desc">やり直しのムダを測り、学びを次のAIへ渡し、予測・体感・実測で効果を確かめる循環。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#75CFA3" stroke-opacity=".055"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75CFA3"/></marker>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#0B1211"/><rect width="1200" height="260" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic UI', sans-serif">
    <path d="M366 108H428M772 108H834" stroke="#75CFA3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1040 184C1014 235 189 235 160 184" fill="none" stroke="#75CFA3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="600" y="247" text-anchor="middle" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="800" letter-spacing="2">NEXT RUN</text>
    <g transform="translate(48 52)"><rect width="318" height="132" rx="17" fill="#111D1A" stroke="#75CFA3" stroke-width="3"/><text x="24" y="43" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800">MEASURE / ムダを測る</text><text x="24" y="91" fill="#F4F0E8" font-size="24" font-weight="700">Loop Tax · Prompt ROI</text></g>
    <g transform="translate(454 52)"><rect width="318" height="132" rx="17" fill="#17150F" stroke="#F0B667" stroke-width="3"/><text x="24" y="43" fill="#F0B667" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800">TEACH / 学びを渡す</text><text x="24" y="91" fill="#F4F0E8" font-size="24" font-weight="700">handoff · coach</text></g>
    <g transform="translate(860 52)"><rect width="292" height="132" rx="17" fill="#111D1A" stroke="#D7E2DC" stroke-width="3"/><text x="22" y="43" fill="#F4F0E8" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="800">VERIFY / 効いたか確かめる</text><text x="22" y="91" fill="#75CFA3" font-size="22" font-weight="800">predict · <tspan fill="#F0B667">felt</tspan> · <tspan fill="#D7E2DC">measured</tspan></text></g>
  </g>
