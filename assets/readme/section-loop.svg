<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">KaizenLogのAI改善ループ</title>
  <desc id="desc">やり直しのムダを測り、学びを次のAIへ渡し、予測・体感・実測で効果を確かめる循環。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#75CFA3" stroke-opacity=".055"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75CFA3"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#0B1211"/><rect width="1200" height="760" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic UI', sans-serif">
    <text x="60" y="46" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800" letter-spacing="3">MEASURABLE AI IMPROVEMENT LOOP</text>
    <g transform="translate(60 80)"><rect width="1080" height="150" rx="18" fill="#111D1A" stroke="#75CFA3" stroke-width="3"/><text x="34" y="49" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="800">MEASURE / ムダを測る</text><text x="34" y="111" fill="#F4F0E8" font-size="38" font-weight="700">Loop Tax · Prompt ROI</text></g>
    <g transform="translate(60 300)"><rect width="1080" height="150" rx="18" fill="#17150F" stroke="#F0B667" stroke-width="3"/><text x="34" y="49" fill="#F0B667" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="800">TEACH / 学びを渡す</text><text x="34" y="111" fill="#F4F0E8" font-size="38" font-weight="700">handoff · coach</text></g>
    <g transform="translate(60 520)"><rect width="1080" height="150" rx="18" fill="#111D1A" stroke="#D7E2DC" stroke-width="3"/><text x="34" y="49" fill="#F4F0E8" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="800">VERIFY / 効いたか確かめる</text><text x="34" y="111" fill="#75CFA3" font-size="38" font-weight="800">predict · <tspan fill="#F0B667">felt</tspan> · <tspan fill="#D7E2DC">measured</tspan></text></g>
    <path d="M600 244V278M600 464V498" fill="none" stroke="#75CFA3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1148 595H1162V710H38V62H60" fill="none" stroke="#75CFA3" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="600" y="741" text-anchor="middle" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="800" letter-spacing="3">NEXT RUN</text>
  </g>
</svg>
