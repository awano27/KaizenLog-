<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">KaizenLogの計測・記録・引き継ぎフロー</title>
  <desc id="desc">ActivityWatchとAI作業ログをKaizenLogが決定的に集計し、Obsidianへ保存する。任意のLLM提案を検証し、承認された教訓だけをエージェント向け文書へ反映する。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#75CFA3" stroke-opacity=".055"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75CFA3"/></marker>
    <marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#81958C"/></marker>
  </defs>
  <rect width="1200" height="410" rx="24" fill="#0B1211"/><rect width="1200" height="410" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic UI', sans-serif">
    <text x="48" y="48" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="19" font-weight="800" letter-spacing="2">MEASURED DATA / EXPLICIT OWNERSHIP</text>
    <path d="M294 232H324M576 232H606M858 232H888" stroke="#75CFA3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(48 130)"><rect width="246" height="205" rx="18" fill="#111D1A" stroke="#315244" stroke-width="2"/><text x="22" y="42" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800">EVIDENCE</text><path d="M22 59H224" stroke="#315244"/><text x="22" y="101" fill="#F4F0E8" font-size="23" font-weight="700">ActivityWatch</text><text x="22" y="138" fill="#D7E2DC" font-size="20">AI session logs</text><text x="22" y="174" fill="#D7E2DC" font-size="20">Browser AI JSONL</text></g>
    <g transform="translate(324 130)"><rect width="252" height="205" rx="18" fill="#111D1A" stroke="#75CFA3" stroke-width="3"/><text x="22" y="42" fill="#75CFA3" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800">KAIZENLOG</text><path d="M22 59H230" stroke="#315244"/><text x="22" y="105" fill="#F4F0E8" font-size="21" font-weight="700">deterministic metrics</text><text x="22" y="160" fill="#F0B667" font-size="21" font-weight="800">validated proposals</text></g>
    <g transform="translate(606 130)"><rect width="252" height="205" rx="18" fill="#111D1A" stroke="#315244" stroke-width="2"/><text x="22" y="42" fill="#F4F0E8" font-family="ui-monospace, Consolas, monospace" font-size="22" font-weight="800">DAILY RECORD</text><path d="M22 59H230" stroke="#315244"/><text x="22" y="105" fill="#F4F0E8" font-size="21" font-weight="700">Obsidian Markdown</text><text x="22" y="146" fill="#D7E2DC" font-size="20">stats JSON</text></g>
    <g transform="translate(888 130)"><rect width="264" height="205" rx="18" fill="#111D1A" stroke="#F0B667" stroke-width="3"/><text x="22" y="42" fill="#F0B667" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="800">AGENT CONTEXT</text><path d="M22 59H242" stroke="#315244"/><text x="22" y="105" fill="#F4F0E8" font-size="18" font-weight="700">handoff: marker update</text><text x="22" y="150" fill="#D7E2DC" font-size="18" font-weight="700">coach: approval required</text></g>
    <g transform="translate(344 64)"><rect width="210" height="44" rx="14" fill="#101B18" stroke="#81958C" stroke-width="2" stroke-dasharray="7 6"/><text x="105" y="29" text-anchor="middle" fill="#F0B667" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="800">LLM / optional</text></g>
    <path d="M449 108V190H548V283" fill="none" stroke="#81958C" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#muted-arrow)"/>
  </g>
</svg>
