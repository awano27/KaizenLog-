<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title desc">
  <title id="title">ActivityWatchからObsidianまでのデータフロー</title>
  <desc id="desc">ActivityWatchの記録をKaizenLogが分類・集計し、Obsidianの管理マーカー区間へ保存する。LLMは任意で、送信前に設定済みのマスキングを適用する。</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#75CFA3" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75CFA3"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#81958C"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0B1211"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <text x="48" y="46" fill="#75CFA3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" font-weight="700" letter-spacing="3">LOCAL JOURNAL PATH · OPTIONAL INTERPRETATION</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Yu Gothic UI', sans-serif">
    <g transform="translate(48 102)">
      <rect width="286" height="128" rx="18" fill="#111D1A" stroke="#315244" stroke-width="2"/>
      <circle cx="36" cy="38" r="10" fill="#75CFA3"/>
      <text x="58" y="47" fill="#F4F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="27" font-weight="800">ACTIVITYWATCH</text>
      <text x="24" y="91" fill="#B7C6BE" font-size="21">前景アプリの記録</text>
    </g>

    <path d="M354 166H430" stroke="#75CFA3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(454 102)">
      <rect width="292" height="128" rx="18" fill="#17231F" stroke="#75CFA3" stroke-width="3"/>
      <text x="24" y="48" fill="#75CFA3"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="30" font-weight="800">KAIZENLOG</text>
      <text x="24" y="91" fill="#F4F0E8" font-size="21">分類・集計・書き込み</text>
    </g>

    <path d="M766 166H842" stroke="#75CFA3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(866 102)">
      <rect width="286" height="128" rx="18" fill="#111D1A" stroke="#315244" stroke-width="2"/>
      <text x="24" y="48" fill="#F4F0E8"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="30" font-weight="800">OBSIDIAN</text>
      <text x="24" y="91" fill="#B7C6BE" font-size="21">管理マーカー内の日誌</text>
    </g>

    <path d="M600 102V45H702" fill="none" stroke="#81958C" stroke-width="3"
          stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>

    <g transform="translate(716 12)">
      <rect width="436" height="66" rx="16" fill="#101B18" stroke="#81958C" stroke-width="2" stroke-dasharray="8 7"/>
      <text x="22" y="29" fill="#F0B667"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="22" font-weight="800">OPTIONAL LLM</text>
      <text x="22" y="53" fill="#B7C6BE"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="700">LLM-BOUND PROMPT REDACTION</text>
    </g>
  </g>
</svg>
