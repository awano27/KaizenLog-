<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">KaizenLog</title>
  <desc id="desc">Windows activity becomes an Obsidian daily note and small measurable improvement actions overnight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1218"/>
      <stop offset="100%" stop-color="#152028"/>
    </linearGradient>
    <pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a3844" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#dot)" opacity="0.7"/>

  <!-- left title block -->
  <g transform="translate(56 48)">
    <text x="0" y="28" fill="#7a9e8f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">LOCAL-FIRST · WINDOWS · OBSIDIAN</text>
    <text x="0" y="96" fill="#f2f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="64" font-weight="700">KaizenLog</text>
    <text x="0" y="148" fill="#c5d4de" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="24">
      毎晩のPC操作ログを、翌日に試せる改善アクションへ。
    </text>
    <text x="0" y="186" fill="#8aa0ad" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="20">
      ActivityWatch → Markdown日誌 → LLM提案。手書きノートは壊さない。
    </text>

    <g transform="translate(0 230)">
      <rect width="168" height="42" rx="10" fill="#1e3d33" stroke="#3d9a7a" stroke-width="1.5"/>
      <text x="84" y="27" text-anchor="middle" fill="#8fd4b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">kaizenlog setup</text>
      <rect x="184" width="148" height="42" rx="10" fill="#2a2216" stroke="#e8a54b" stroke-width="1.5"/>
      <text x="258" y="27" text-anchor="middle" fill="#f0c98a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">kaizenlog run</text>
      <rect x="348" width="164" height="42" rx="10" fill="#1a2730" stroke="#5d7a8c" stroke-width="1.5"/>
      <text x="430" y="27" text-anchor="middle" fill="#a8c0d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">kaizenlog today</text>
    </g>
  </g>

  <!-- right: daily note card proof -->
  <g transform="translate(720 42)">
    <rect width="420" height="296" rx="18" fill="#101820" stroke="#2f4454" stroke-width="2"/>
    <rect x="18" y="18" width="384" height="36" rx="8" fill="#182430"/>
    <circle cx="40" cy="36" r="5" fill="#e07a6a"/>
    <circle cx="58" cy="36" r="5" fill="#e8a54b"/>
    <circle cx="76" cy="36" r="5" fill="#3d9a7a"/>
    <text x="100" y="41" fill="#8aa0ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">01 Daily Notes / 2026-07-26.md</text>

    <text x="28" y="88" fill="#3d9a7a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="18" font-weight="700">📌 今日のアクション</text>
    <text x="28" y="118" fill="#9ab0bc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="15">直近14日: 消化率 42% / PASS率 75%</text>

    <rect x="28" y="138" width="364" height="44" rx="8" fill="#15202a" stroke="#2a3d4a"/>
    <text x="44" y="166" fill="#d6e2ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">[ ] KZN-…001  25分枠を1件入れる</text>

    <rect x="28" y="192" width="364" height="44" rx="8" fill="#15202a" stroke="#2a3d4a"/>
    <text x="44" y="220" fill="#d6e2ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">[x] KZN-…002  調査リンクを3件まとめる</text>

    <text x="28" y="268" fill="#e8a54b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif" font-size="15">🚀 明日の最小アクション · PASS/FAIL 付き</text>
    <text x="28" y="292" fill="#6f8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">markers only · handwritten notes stay</text>
  </g>
</svg>
