# KaizenLog 設定ファイル
#
# 推奨: `kaizenlog setup` で対話的に生成する（検出優先・AppData 既定）。
# 既定の置き場所: %APPDATA%/kaizenlog/config.toml（Windows）
#                 $XDG_CONFIG_HOME/kaizenlog/config.toml または ~/.config/kaizenlog/config.toml
# 手動: `kaizenlog init-config`（省略時は上記 AppData/XDG）/ `init-config --output PATH`
# 上書きパス: 環境変数 KAIZENLOG_CONFIG または CLI の --config
# setup は実在する LLM モデル id を書いてくれる（例の qwen3:8b が無い環境でも安全）。

[general]
timezone = "Asia/Tokyo"
vault_dir = 'C:/develop/obsidian/2026'   # Obsidianボールトのルート
daily_notes_dir = "01 Daily Notes"
experiments_dir = "03 Areas/Kaizen Experiments"   # カイゼン実験ノートの置き場所
stats_dir = ".kaizenlog/stats"   # パターン検出用の日次統計JSON（ドットフォルダ=Obsidian非表示）
logs_dir = ".kaizenlog/logs"     # 実行ログ（kaizenlog status で確認）
memory_dir = "Kaizen/Memory"     # 提案の記録（Kaizen Memory、重複提案の防止に使用）
monthly_dir = "04 Monthly"       # 月次レポート
auto_backfill_days = 3      # 毎晩の実行時に直近N日の欠損を自動補完（0で無効）
log_retention_days = 90     # 実行ログの保持日数
min_block_minutes = 3.0     # タイムラインに載せる最小ブロック長（分）
session_gap_minutes = 5.0   # この分数以上空いたら別画面ブロック扱い

[notifications]
on_failure = true   # 夜間実行が失敗したときWindows通知を出す

[privacy]
# LLMへ送信する前にマスクする正規表現（ボールト内の日誌は原文のまま保持される）
# 例: redact_patterns = ["(株)〇〇商事", "案件[A-Z]-\d+", "\S+@\S+\.co\.jp"]
redact_patterns = []
replacement = "[REDACTED]"
# hide_private_titles = true   # タイムラインで私的タイトルを伏せる

[activitywatch]
base_url = "http://localhost:5600"

# [screenpipe]
# 画面テキスト補完（read-only・既定 OFF）。API キーは toml に書かず環境変数へ。
# enabled = false
# base_url = "http://localhost:3030"
# api_key_env = "SCREENPIPE_API_KEY"
# timeout_seconds = 3.0
# max_lines = 3
# max_excerpt_chars = 120

# [effort]
# enabled = true
# project_roots = ["C:/develop"]
# private_categories = ["エンタメ"]
# min_display_minutes = 1.0

[aiwork]
# Claude Codeのセッションログ（JSONL）から「AI作業の質」を集計する
# 往復数・細切れセッション・ツールエラー・中断を検出し、改善提案の材料にする
enabled = true
claude_projects_dir = "~/.claude/projects"
# session_details = true   # 往復上位セッションの依頼・ファイル・コマンド詳細

[nippou]
# kaizenlog run 後に決定論日報ドラフトを自動書き込み（既定 ON）
auto_write = true

# 空転ブレーカー（Claude Code UserPromptSubmit / Stop フック）
# [guard]
# enabled = true
# notify = false  # true にしたときだけWindowsトーストを表示
# retry_threshold = 3
# tool_error_streak = 3
# cooldown_seconds = 300
# debounce_seconds = 30

[llm]
# LLMバックエンド優先度（指定されたものが失敗したら自動フォールバック）:
#   1. 設定値（下記から選択）
#   2. ローカルLLM (Ollama)
#   3. LLM なし
#
# "claude-code-cli"   : Claude Code CLI（要: https://claude.com/claude-code & ログイン済み）
# "copilot-cli"       : GitHub Copilot CLI（要: npm install -g @github/copilot & ログイン済み）
# "openai-compatible" : GitHub Models / Ollama などOpenAI互換API
# "none"              : 改善提案をスキップ（ログ生成のみ）
#
# 注: 指定バックエンドが利用できない場合、[llm.openai_compatible] の設定
#     （既定: Ollama http://localhost:11434/v1）に自動フォールバックします。
#     無効にするには fallback_to_local = false。
backend = "copilot-cli"
fallback_to_local = true
# システムプロンプト: 同梱テンプレート名（daily_advisor / privacy_safe /
# weekly_review / ai_work_deep_review）または自作プロンプトのファイルパス
system_prompt = "daily_advisor"
lookback_days = 7   # 傾向分析のために渡す過去日数
retries = 2                # 一時エラー時の再試行回数
retry_wait_seconds = 20    # 再試行までの待ち秒数

[llm.claude_code_cli]
command = "claude"
extra_args = []   # 例: ["--model", "haiku"]

[llm.copilot_cli]
command = "copilot"
extra_args = []   # 例: ["--model", "claude-sonnet-4"]

[llm.openai_compatible]
# --- Ollama（完全ローカル・GPU不要、8Bモデルは16GB RAM推奨）---
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
# thinkingモデルが本文生成前にcontextを使い切らないよう、通常の改善提案では無効化
reasoning_effort = "none"   # none | low | medium | high
# --- GitHub Models（無料API）を使う場合は下記に差し替え ---
# base_url = "https://models.github.ai/inference"
# model = "openai/gpt-4o"
# api_key_env に指定した環境変数へ models:read 権限のPATを設定
api_key_env = "KAIZENLOG_API_KEY"
timeout_seconds = 600

# カテゴリ分類ルールの追加例（デフォルトルールより優先されます）
# [[categories.rules]]
# name = "AI作業"
# ai = true
# patterns = ["自社のAIツール名"]
