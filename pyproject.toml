[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaizenlog"
version = "1.5.0rc1"
description = "Windows daily activity -> Markdown journal -> LLM-powered kaizen (improvement) suggestions. Built on ActivityWatch."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "negibouzu" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tzdata; platform_system == 'Windows'",
]
keywords = ["activitywatch", "obsidian", "productivity", "llm", "time-tracking", "kaizen"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kaizenlog = "kaizenlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaizenlog = ["prompts/*.md", "skills/*/SKILL.md", "eval_samples/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
